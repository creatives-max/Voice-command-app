openapi: 3.0.3
info:
  title: VoiceControl API
  version: 1.0.0
  description: |
    Backend for VoiceControl: authentication, user profile, the versioned flow library,
    and AI interpretation of screen + speech. All `/v1` endpoints except auth require
    `Authorization: Bearer <accessToken>`. Errors use `{"error": "<code>", "message": "..."}`.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Profile
  - name: Flows
  - name: AI
  - name: History
  - name: Ops
paths:
  /health:
    get:
      tags: [Ops]
      security: []
      summary: Liveness probe
      responses:
        "200": { description: OK }
  /ready:
    get:
      tags: [Ops]
      security: []
      summary: Readiness probe (database + Redis)
      responses:
        "200": { description: Ready }
        "503": { description: A dependency is down }
  /v1/auth/register:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      description: Rotates the refresh token. The old refresh token stops working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200": { description: New tokens, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                everywhere: { type: boolean, description: Revoke every session of this user }
      responses:
        "204": { description: Signed out }
  /v1/me:
    get:
      tags: [Auth]
      responses:
        "200": { description: Current user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /v1/profile:
    get:
      tags: [Profile]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
    put:
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "200": { description: Saved profile, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/flows:
    get:
      tags: [Flows]
      parameters:
        - { name: appPackage, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Flows, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FlowSummary" } }
                  limit: { type: integer }
                  offset: { type: integer }
    post:
      tags: [Flows]
      description: Upload a flow recorded on the phone. Idempotent per app + screen signature.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFlowRequest" }
      responses:
        "201": { description: Created (or the existing flow), content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/flows/apps:
    get:
      tags: [Flows]
      summary: Apps that have flows, with counts
      responses:
        "200":
          description: Apps
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    appPackage: { type: string }
                    flowCount: { type: integer }
                    lastUpdated: { type: string, format: date-time }
  /v1/flows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Flows]
      responses:
        "200": { description: Flow with current steps, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Flows]
      description: Saves a new version (questions, rules, defaults, skips, order, help videos). Fails with 409 if `expectedVersion` is stale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFlowRequest" }
      responses:
        "200": { description: New current version, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Flows]
      responses:
        "204": { description: Deleted }
  /v1/flows/{id}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Flows]
      responses:
        "200": { description: Versions, newest first, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FlowVersion" } } } } }
  /v1/flows/{id}/versions/{version}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Flows]
      responses:
        "200": { description: Version, content: { application/json: { schema: { $ref: "#/components/schemas/FlowVersion" } } } }
  /v1/flows/{id}/rollback:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Flows]
      description: Creates a new version that copies the steps of an older version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer } } }
      responses:
        "200": { description: New current version, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
  /v1/ai/interpret:
    post:
      tags: [AI]
      description: |
        Decides what an utterance means on the current screen. Control commands are handled
        deterministically; answers go to the configured LLM provider with offline fallback.
        Values of sensitive fields are never accepted or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterpretRequest" }
      responses:
        "200": { description: Interpretation, content: { application/json: { schema: { $ref: "#/components/schemas/Interpretation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/flows/match:
    post:
      tags: [Flows]
      description: |
        Finds the user's flow for a live screen: exact screen signature first, then the nearest
        pgvector embedding above the similarity threshold. Always returns the current version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appPackage, signature]
              properties:
                appPackage: { type: string }
                signature: { type: string, example: "com.shop|SignupActivity|button:create account|text_field/email:email" }
      responses:
        "200":
          description: Match result (flow is absent when nothing matched)
          content:
            application/json:
              schema:
                type: object
                properties:
                  flow: { $ref: "#/components/schemas/Flow" }
                  matchedBy: { type: string, enum: [exact, vector] }
                  similarity: { type: number }
  /v1/runs:
    get:
      tags: [History]
      parameters:
        - { name: appPackage, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Voice sessions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  limit: { type: integer }
                  offset: { type: integer }
    post:
      tags: [History]
      description: Upload finished sessions from the phone. Idempotent by sessionId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runs]
              properties:
                runs: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Run" } }
      responses:
        "200": { description: Number of new runs stored, content: { application/json: { schema: { type: object, properties: { inserted: { type: integer } } } } } }
    delete:
      tags: [History]
      summary: Delete all history
      responses:
        "204": { description: Deleted }
  /v1/runs/stats:
    get:
      tags: [History]
      responses:
        "200":
          description: Totals and top apps
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRuns: { type: integer }
                  completedRuns: { type: integer }
                  fieldsFilled: { type: integer }
                  topApps: { type: array, items: { type: object, properties: { appPackage: { type: string }, runs: { type: integer } } } }
  /v1/runs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [History]
      responses:
        "200": { description: Run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
    delete:
      tags: [History]
      responses:
        "204": { description: Deleted }
  /v1/ai/vision:
    post:
      tags: [AI]
      description: |
        Vision fallback for apps that expose no readable accessibility nodes: detects input fields and
        buttons on a screenshot (JPEG, base64) and returns their boxes in image pixels.
        Requires a vision-capable provider (anthropic or openai).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageName, imageBase64, width, height]
              properties:
                packageName: { type: string }
                imageBase64: { type: string }
                width: { type: integer }
                height: { type: integer }
                language: { type: string, enum: [ENGLISH, HINDI, HINGLISH, MARATHI, TAMIL, TELUGU, BENGALI, GUJARATI] }
      responses:
        "200":
          description: Detected elements
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  elements:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: "vision:e1" }
                        kind: { $ref: "#/components/schemas/ElementKind" }
                        label: { type: string }
                        fieldType: { $ref: "#/components/schemas/FieldType" }
                        x: { type: integer }
                        y: { type: integer }
                        width: { type: integer }
                        height: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/devices:
    post:
      tags: [Automation]
      summary: Register (or update) this phone for remote runs
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RegisterDevice" } } } }
      responses:
        "200": { description: Device, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "409": { description: Device id belongs to another account }
    get:
      tags: [Automation]
      summary: Phones signed in to this account
      responses:
        "200": { description: Devices, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Device" } } } } }
  /v1/devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Automation]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, remoteRuns: { type: boolean } } } } } }
      responses:
        "200": { description: Device, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
    delete:
      tags: [Automation]
      responses:
        "204": { description: Removed }
  /v1/devices/{id}/commands:
    get:
      tags: [Automation]
      summary: Long-poll used by the phone for flows to run and runs to stop
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 30, default: 25 } }
      responses:
        "200":
          description: Pending run requests (now DELIVERED) and run ids to cancel
          content: { application/json: { schema: { type: object, properties: { run: { type: array, items: { $ref: "#/components/schemas/RunRequest" } }, cancel: { type: array, items: { type: string } } } } } }
  /v1/devices/{id}/triggers:
    get:
      tags: [Automation]
      summary: Enabled app-open triggers that apply to this phone
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Triggers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Trigger" } } } } }
  /v1/devices/{id}/app-open-runs:
    post:
      tags: [Automation]
      summary: The phone started a flow because its app opened
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [flowId], properties: { flowId: { type: string }, triggerId: { type: string } } } } } }
      responses:
        "201": { description: Run request, content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
  /v1/flows/{id}/triggers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Automation]
      responses:
        "200": { description: Triggers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Trigger" } } } } }
    post:
      tags: [Automation]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TriggerInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Trigger" } } } }
        "400": { description: Invalid schedule or time zone }
  /v1/triggers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Automation]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TriggerInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Trigger" } } } }
    delete:
      tags: [Automation]
      responses:
        "204": { description: Deleted }
  /v1/run-requests:
    post:
      tags: [Automation]
      summary: Run a flow now on a phone (default the most recently seen one)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [flowId], properties: { flowId: { type: string }, deviceId: { type: string } } } } } }
      responses:
        "201": { description: Run request, content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
        "400": { description: No phone, or remote runs are off on it }
    get:
      tags: [Automation]
      parameters:
        - { name: flowId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200": { description: Run requests, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RunRequest" } } } } }
  /v1/run-requests/{id}:
    get:
      tags: [Automation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Run request, content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
  /v1/run-requests/{id}/events:
    get:
      tags: [Automation]
      summary: Live log (long-poll) — events after `after`, waiting up to `wait` seconds for new ones
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 30, default: 0 } }
      responses:
        "200":
          description: Current request and new events
          content: { application/json: { schema: { type: object, properties: { request: { $ref: "#/components/schemas/RunRequest" }, events: { type: array, items: { $ref: "#/components/schemas/RunEvent" } } } } } }
  /v1/run-requests/{id}/cancel:
    post:
      tags: [Automation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Cancelled (or stop requested), content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
        "409": { description: Already finished }
  /v1/run-requests/{id}/report:
    post:
      tags: [Automation]
      summary: Status and value-free log lines from the phone running the request
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                status: { $ref: "#/components/schemas/RunRequestStatus" }
                events: { type: array, maxItems: 50, items: { type: object, properties: { kind: { type: string }, message: { type: string, maxLength: 300 } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
        "403": { description: Run belongs to another device }
        "409": { description: Already finished }
  /v1/marketplace:
    get:
      tags: [Marketplace]
      summary: Browse and search published flows and starter templates
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Full-text search over name, description, app and tags }
        - { name: category, in: query, schema: { type: string } }
        - { name: appPackage, in: query, schema: { type: string } }
        - { name: templates, in: query, schema: { type: boolean } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [popular, rating, recent, relevance] } }
        - { name: limit, in: query, schema: { type: integer, default: 24 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Listings, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Listing" } }, limit: { type: integer }, offset: { type: integer } } } } } }
  /v1/marketplace/categories:
    get:
      tags: [Marketplace]
      responses:
        "200": { description: Category ids, content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /v1/marketplace/templates:
    get:
      tags: [Marketplace]
      summary: Starter templates with their steps and per-step matching keywords
      responses:
        "200":
          description: Templates
          content: { application/json: { schema: { type: array, items: { type: object, properties: { listing: { $ref: "#/components/schemas/Listing" }, steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }, keywords: { type: object, additionalProperties: { type: array, items: { type: string } } } } } } } }
  /v1/marketplace/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Marketplace]
      summary: Listing with latest steps, versions, reviews and your imported copy
      responses:
        "200": { description: Listing detail, content: { application/json: { schema: { $ref: "#/components/schemas/ListingDetail" } } } }
    delete:
      tags: [Marketplace]
      summary: Unpublish (owner); importers keep their copies
      responses:
        "204": { description: Unpublished }
  /v1/marketplace/{id}/import:
    post:
      tags: [Marketplace]
      summary: Import into your flows (or as a new version of your flow for the same screen)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { content: { application/json: { schema: { type: object, properties: { version: { type: integer } } } } } }
      responses:
        "201": { description: Your flow, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "400": { description: Templates are applied, not imported }
  /v1/marketplace/{id}/rating:
    put:
      tags: [Marketplace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [stars], properties: { stars: { type: integer, minimum: 1, maximum: 5 }, review: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { description: Listing with updated rating, content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } } }
  /v1/flows/{id}/publish:
    post:
      tags: [Marketplace]
      summary: Publish the flow's current version (default values are removed); publishing again adds a version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [category], properties: { name: { type: string }, description: { type: string, maxLength: 1000 }, category: { type: string }, tags: { type: array, maxItems: 8, items: { type: string, maxLength: 24 } }, changelog: { type: string } } } } }
      responses:
        "200": { description: Listing, content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } } }
  /v1/flows/{id}/update-from-source:
    post:
      tags: [Marketplace]
      summary: Update an imported flow to the listing's latest version (as a new version)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated flow, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "409": { description: Already up to date }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: validation_error }
              message: { type: string }
  schemas:
    Listing:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        appPackage: { type: string, description: "\"*\" for templates" }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        isTemplate: { type: boolean }
        ownerName: { type: string, nullable: true }
        mine: { type: boolean }
        latestVersion: { type: integer }
        installCount: { type: integer }
        ratingAverage: { type: number, nullable: true }
        ratingCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ListingDetail:
      type: object
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
        keywords: { type: object, additionalProperties: { type: array, items: { type: string } } }
        versions: { type: array, items: { type: object, properties: { version: { type: integer }, changelog: { type: string, nullable: true }, stepCount: { type: integer }, createdAt: { type: string, format: date-time } } } }
        myRating: { type: object, nullable: true, properties: { stars: { type: integer }, review: { type: string, nullable: true } } }
        reviews: { type: array, items: { type: object, properties: { stars: { type: integer }, review: { type: string, nullable: true }, userName: { type: string }, updatedAt: { type: string, format: date-time } } } }
        importedFlowId: { type: string, nullable: true }
        importedVersion: { type: integer, nullable: true }
        updateAvailable: { type: boolean }
    RegisterDevice:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid, description: Generated once per installation }
        name: { type: string, maxLength: 60 }
        platform: { type: string, default: android }
        appVersion: { type: string, nullable: true }
        remoteRuns: { type: boolean, nullable: true }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        appVersion: { type: string, nullable: true }
        remoteRuns: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
        online: { type: boolean, description: Polled in the last 90 seconds }
        createdAt: { type: string, format: date-time }
    TriggerInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [APP_OPEN, SCHEDULE] }
        enabled: { type: boolean, default: true }
        cron: { type: string, nullable: true, description: "5-field cron (minute hour day month weekday), SCHEDULE only" }
        timezone: { type: string, nullable: true, description: IANA zone, SCHEDULE only }
        deviceId: { type: string, nullable: true, description: Phone to run on; null = most recently seen }
    Trigger:
      allOf:
        - $ref: "#/components/schemas/TriggerInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            flowId: { type: string, format: uuid }
            nextRunAt: { type: string, format: date-time, nullable: true }
            lastRunAt: { type: string, format: date-time, nullable: true }
            upcoming: { type: array, items: { type: string, format: date-time } }
            appPackage: { type: string, nullable: true }
    RunRequestStatus:
      type: string
      enum: [PENDING, DELIVERED, RUNNING, COMPLETED, FAILED, STOPPED, CANCEL_REQUESTED, CANCELLED, EXPIRED]
    RunRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        flowId: { type: string, format: uuid, nullable: true }
        flowName: { type: string }
        appPackage: { type: string }
        deviceId: { type: string, nullable: true }
        triggerId: { type: string, nullable: true }
        source: { type: string, enum: [MANUAL, SCHEDULE, APP_OPEN] }
        status: { $ref: "#/components/schemas/RunRequestStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RunEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind: { type: string }
        message: { type: string, description: Labels and outcomes only, never values }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, description: Letters and numbers }
        name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresInSeconds: { type: integer }
        user: { $ref: "#/components/schemas/User" }
    Profile:
      type: object
      properties:
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        addressLine: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        pincode: { type: string, nullable: true, pattern: "^\\d{6}$" }
        dateOfBirth: { type: string, nullable: true, example: 12/03/1990 }
    ElementKind: { type: string, enum: [TEXT_FIELD, BUTTON, CHECKBOX, SWITCH, RADIO, DROPDOWN, LINK] }
    FieldType: { type: string, enum: [TEXT, NAME, EMAIL, PHONE, NUMBER, PASSWORD, OTP, PIN, DATE, ADDRESS, PINCODE, MULTILINE, SEARCH, URL, AMOUNT] }
    FlowStep:
      type: object
      required: [id, order, elementId, label, kind]
      properties:
        id: { type: string }
        order: { type: integer }
        elementId: { type: string, description: Stable element id on the screen }
        label: { type: string }
        kind: { $ref: "#/components/schemas/ElementKind" }
        fieldType: { $ref: "#/components/schemas/FieldType" }
        action:
          type: string
          enum: [FILL, CLICK, TOGGLE, READ, SET_VARIABLE, REPEAT, NEXT_SCREEN, OPEN_APP]
          description: >-
            Element steps (FILL, CLICK, TOGGLE, READ) need elementId. Logic steps: SET_VARIABLE stores valueExpression
            in variable; REPEAT loops over repeat.stepIds; NEXT_SCREEN waits for the next screen; OPEN_APP opens appPackage.
        question: { type: string, nullable: true, description: Custom spoken question }
        rules:
          type: array
          items: { type: string }
          description: "required | email | phone | pincode | digits:N | min:N | max:N | regex:<pattern> | oneOf:a|b"
        defaultValue: { type: string, nullable: true }
        skip: { type: boolean }
        helpVideoUrl: { type: string, nullable: true, description: https link shown during this step }
        profileKey: { type: string, nullable: true, enum: [FULL_NAME, FIRST_NAME, LAST_NAME, EMAIL, PHONE, ADDRESS_LINE, CITY, STATE, PINCODE, DATE_OF_BIRTH] }
        condition: { type: string, nullable: true, description: "Expression (docs/spec/expressions.json); the step runs only when true" }
        elseValue: { type: string, nullable: true, description: Expression filled when the condition is false }
        variable: { type: string, nullable: true, pattern: "^[A-Za-z_][A-Za-z0-9_]*$", description: "Receives the answer; default is the label in snake_case" }
        valueExpression: { type: string, nullable: true, description: Expression filled (or stored) without asking }
        repeat: { $ref: "#/components/schemas/RepeatSpec" }
        appPackage: { type: string, nullable: true, description: OPEN_APP target or the app NEXT_SCREEN expects }
        waitSeconds: { type: integer, nullable: true, minimum: 1, maximum: 120 }
    RepeatSpec:
      type: object
      nullable: true
      properties:
        stepIds: { type: array, items: { type: string }, description: Steps run once per item (same screen) }
        addMoreElementId: { type: string, nullable: true }
        addMoreLabel: { type: string, nullable: true, description: Button pressed between items }
        maxIterations: { type: integer, minimum: 1, maximum: 50 }
        countExpression: { type: string, nullable: true, description: "Number of items; when absent the user is asked 'add another?'" }
        itemLabel: { type: string, nullable: true }
    FlowSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        appPackage: { type: string }
        name: { type: string }
        currentVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Flow:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        appPackage: { type: string }
        name: { type: string }
        screenSignature: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
        updatedAtMillis: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sourcePublishedId: { type: string, nullable: true, description: Marketplace listing this flow was imported from }
        sourceVersion: { type: integer, nullable: true }
    FlowVersion:
      type: object
      properties:
        version: { type: integer }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
        source: { type: string, enum: [DEVICE, DASHBOARD, ROLLBACK, IMPORT] }
        changeNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateFlowRequest:
      type: object
      required: [appPackage, name, screenSignature, steps]
      properties:
        appPackage: { type: string, example: com.example.shop }
        name: { type: string }
        screenSignature: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
    UpdateFlowRequest:
      type: object
      required: [expectedVersion, steps]
      properties:
        expectedVersion: { type: integer }
        name: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
        changeNote: { type: string }
    ScreenElement:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ElementKind" }
        label: { type: string }
        fieldType: { $ref: "#/components/schemas/FieldType" }
        hint: { type: string }
        value: { type: string, description: Never sent for sensitive fields }
        isSensitive: { type: boolean }
        isEnabled: { type: boolean }
        isChecked: { type: boolean }
    ScreenContext:
      type: object
      required: [packageName, elements]
      properties:
        packageName: { type: string }
        activityName: { type: string }
        title: { type: string }
        signature: { type: string }
        elements: { type: array, items: { $ref: "#/components/schemas/ScreenElement" } }
    InterpretRequest:
      type: object
      required: [screen, utterance]
      properties:
        screen: { $ref: "#/components/schemas/ScreenContext" }
        currentFieldId: { type: string }
        utterance: { type: string, maxLength: 500 }
        language: { type: string, enum: [ENGLISH, HINDI, HINGLISH, MARATHI, TAMIL, TELUGU, BENGALI, GUJARATI] }
        question: { type: string }
        transliterate: { type: boolean }
        memory:
          type: array
          maxItems: 12
          description: Earlier answers in this session (never sensitive values), to resolve "same as above", "his name", etc.
          items: { type: object, properties: { label: { type: string }, value: { type: string } } }
    Run:
      type: object
      required: [sessionId, appPackage, startedAtMillis, endedAtMillis, status, language, screens]
      properties:
        sessionId: { type: string, format: uuid }
        appPackage: { type: string }
        startedAtMillis: { type: integer, format: int64 }
        endedAtMillis: { type: integer, format: int64 }
        status: { type: string, enum: [COMPLETED, STOPPED, FAILED] }
        language: { type: string, enum: [ENGLISH, HINDI, HINGLISH, MARATHI, TAMIL, TELUGU, BENGALI, GUJARATI] }
        filledCount: { type: integer, readOnly: true }
        stepCount: { type: integer, readOnly: true }
        screens:
          type: array
          items:
            type: object
            properties:
              appPackage: { type: string }
              activityName: { type: string }
              screenTitle: { type: string }
              screenSignature: { type: string }
              flowId: { type: string }
              flowVersion: { type: integer }
              steps:
                type: array
                items:
                  type: object
                  properties:
                    elementId: { type: string }
                    label: { type: string }
                    kind: { $ref: "#/components/schemas/ElementKind" }
                    fieldType: { $ref: "#/components/schemas/FieldType" }
                    question: { type: string }
                    outcome: { type: string, enum: [FILLED, DEFAULT_FILLED, KEPT, SKIPPED, MANUAL, CLICKED, TOGGLED, FAILED] }
                    interpretedBy: { type: string }
    Interpretation:
      type: object
      properties:
        intent: { type: string, enum: [FILL, CLICK, NEXT, PREVIOUS, SKIP, SUBMIT, BACK, SCROLL_DOWN, SCROLL_UP, REPEAT, STOP, YES, NO, CLEAR, HELP, UNDO, READ_SCREEN, UNKNOWN] }
        targetId: { type: string }
        value: { type: string }
        extraFills:
          type: array
          items: { type: object, properties: { targetId: { type: string }, value: { type: string } } }
        reply: { type: string }
        confidence: { type: number }
        source: { type: string, example: anthropic }

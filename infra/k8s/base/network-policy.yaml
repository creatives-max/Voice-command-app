# Only the backend may talk to Postgres and Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datastores-from-backend-only
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [postgres, redis]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend

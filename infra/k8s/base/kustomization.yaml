apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voicecontrol
labels:
  - pairs:
      app.kubernetes.io/part-of: voicecontrol
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - otel-collector.yaml
  - backend.yaml
  - dashboard.yaml
  - ingress.yaml
  - network-policy.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - collector.yaml=collector.yaml

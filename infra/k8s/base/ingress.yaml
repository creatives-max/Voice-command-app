apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voicecontrol
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.voicecontrol.example, dashboard.voicecontrol.example]
      secretName: voicecontrol-tls
  rules:
    - host: api.voicecontrol.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { name: http }
    - host: dashboard.voicecontrol.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port: { name: http }

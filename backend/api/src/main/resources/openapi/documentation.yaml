openapi: 3.0.3
info:
  title: VoiceControl API
  version: 1.0.0
  description: |
    Backend for VoiceControl: authentication, user profile, the versioned flow library,
    and AI interpretation of screen + speech. All `/v1` endpoints except auth require
    `Authorization: Bearer <accessToken>`. Errors use `{"error": "<code>", "message": "..."}`.

    Organizations: send `X-Org-Id: <orgId>` to list an organization's flows instead of your own.
    Organization API keys (`X-Api-Key: vck_…` or `Authorization: Bearer vck_…`) work on the flow
    endpoints (`flows:read`, `flows:write`) and on `POST /v1/run-requests` (`runs:write`); a key acts as
    its creator, only on its organization's flows, and is rate limited per minute (429 when exceeded).

    Webhooks are POSTed as JSON `{id, type, createdAt, orgId, data}` with headers `X-VoiceControl-Event`,
    `X-VoiceControl-Delivery`, `X-VoiceControl-Timestamp` and `X-VoiceControl-Signature: t=<unix>,v1=<hex>`
    where `v1 = HMAC-SHA256(secret, "<t>.<raw body>")`. Reject timestamps older than 5 minutes; a 2xx
    response acknowledges, anything else is retried after 30 s, 2 min, 10 min, 30 min, 1 h and 3 h.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Profile
  - name: Flows
  - name: AI
  - name: History
  - name: Ops
  - name: Teams
  - name: Analytics
  - name: Collaboration
  - name: Caregiving
    description: |
      Remote caregiver mode with consent. The person to be helped creates an invite code with the permissions they
      agree to (`edit_flows`, `run_flows`, `view_history`; seeing flows, triggers, phones and runs is always included).
      The caregiver accepts it, then sends `X-Care-Link: <link id>` to work on that person's flows through the normal
      endpoints (list/get/edit flows, versions, rollback, triggers, dry run, analytics, devices, run now, run history).
      Anything else is refused while acting (GET requests answer for the caregiver themself). Every change and run is
      recorded on the link; either side can end it. API keys can't act for someone.
paths:
  /health:
    get:
      tags: [Ops]
      security: []
      summary: Liveness probe
      responses:
        "200": { description: OK }
  /ready:
    get:
      tags: [Ops]
      security: []
      summary: Readiness probe (database + Redis)
      responses:
        "200": { description: Ready }
        "503": { description: A dependency is down }
  /v1/auth/register:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      tags: [Auth]
      description: After 10 wrong passwords for one account within 15 minutes, sign-in for that account answers 429 until the 15 minutes are over.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      description: Rotates the refresh token. The old refresh token stops working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200": { description: New tokens, content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                everywhere: { type: boolean, description: Revoke every session of this user }
      responses:
        "204": { description: Signed out }
  /v1/me:
    get:
      tags: [Auth]
      responses:
        "200": { description: Current user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
    delete:
      tags: [Auth]
      summary: Delete your account and data (GDPR erasure)
      description: Organizations where you are the only member are deleted; your organization flows move to another admin. Fails with 409 while you are the only admin of an organization with other members.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } } }
      responses:
        "204": { description: Deleted; all sessions signed out }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/me/password:
    post:
      tags: [Auth]
      summary: Change your password (signs out every other session)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 8 } } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/me/sessions:
    get:
      tags: [Auth]
      summary: Browsers and phones signed in to your account, most recently used first
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    client: { type: string, nullable: true, example: Chrome on Windows }
                    createdAt: { type: string, format: date-time }
                    lastUsedAt: { type: string, format: date-time }
                    current: { type: boolean, description: The session making this request }
  /v1/me/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Sign out one session
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Signed out }
        "404": { $ref: "#/components/responses/Error" }
  /v1/profile:
    get:
      tags: [Profile]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
    put:
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "200": { description: Saved profile, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/flows:
    get:
      tags: [Flows]
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - { name: appPackage, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Flows, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FlowSummary" } }
                  limit: { type: integer }
                  offset: { type: integer }
    post:
      tags: [Flows]
      description: Upload a flow recorded on the phone. Idempotent per app + screen signature.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFlowRequest" }
      responses:
        "201": { description: Created (or the existing flow), content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/flows/apps:
    get:
      tags: [Flows]
      summary: Apps that have flows, with counts
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Apps
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    appPackage: { type: string }
                    flowCount: { type: integer }
                    lastUpdated: { type: string, format: date-time }
  /v1/flows/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Flows]
      responses:
        "200": { description: Flow with current steps, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Flows]
      description: Saves a new version (questions, rules, defaults, skips, order, help videos). Fails with 409 if `expectedVersion` is stale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFlowRequest" }
      responses:
        "200": { description: New current version, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Flows]
      responses:
        "204": { description: Deleted }
  /v1/flows/{id}/versions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Flows]
      responses:
        "200": { description: Versions, newest first, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FlowVersion" } } } } }
  /v1/flows/{id}/versions/{version}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Flows]
      responses:
        "200": { description: Version, content: { application/json: { schema: { $ref: "#/components/schemas/FlowVersion" } } } }
  /v1/flows/{id}/rollback:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Flows]
      description: Creates a new version that copies the steps of an older version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: integer } } }
      responses:
        "200": { description: New current version, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
  /v1/flows/{id}/dry-run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Flows]
      description: |
        Dry run (test mode): walks the flow like a phone would (conditions, else values, variables,
        templates, rules, loops, screen and app changes) and answers each question from `answers`.
        When the answers run out, `pending` is the next question; call again with one more answer.
        Nothing runs on a phone and nothing is stored. `steps` simulates unsaved edits. Profile values
        are offered as suggestions for signed-in people only (never with an API key).
        Needs `flows:read` with an API key. Shared vectors: `docs/spec/simulation.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers: { type: array, maxItems: 500, items: { type: string, maxLength: 500 } }
                steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
                useProfile: { type: boolean, default: true }
                today: { type: string, format: date, description: "Date used by today() and year(); default: today (UTC)" }
      responses:
        "200":
          description: Transcript so far
          content:
            application/json:
              schema:
                type: object
                required: [flowVersion, transcript, vars, values, finished]
                properties:
                  flowVersion: { type: integer }
                  transcript:
                    type: array
                    items:
                      type: object
                      required: [kind, text]
                      properties:
                        kind: { type: string, enum: [screen, ask, answer, fill, skip, press, variable, error, manual, done] }
                        text: { type: string }
                        stepId: { type: string, nullable: true }
                  vars: { type: object, additionalProperties: { type: string } }
                  values: { type: object, additionalProperties: { type: string }, description: Final value of each element step by step id }
                  pending:
                    type: object
                    nullable: true
                    properties:
                      stepId: { type: string }
                      question: { type: string }
                      expects: { type: string, enum: [text, yesno] }
                  finished: { type: boolean }
        "400": { description: Invalid steps, answers or date }
  /v1/ai/interpret:
    post:
      tags: [AI]
      description: |
        Decides what an utterance means on the current screen. Control commands are handled
        deterministically; answers go to the configured LLM provider with offline fallback.
        Values of sensitive fields are never accepted or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InterpretRequest" }
      responses:
        "200": { description: Interpretation, content: { application/json: { schema: { $ref: "#/components/schemas/Interpretation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/flows/match:
    post:
      tags: [Flows]
      description: |
        Finds the user's flow for a live screen: exact screen signature first, then the nearest
        pgvector embedding above the similarity threshold. Always returns the current version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appPackage, signature]
              properties:
                appPackage: { type: string }
                signature: { type: string, example: "com.shop|SignupActivity|button:create account|text_field/email:email" }
      responses:
        "200":
          description: Match result (flow is absent when nothing matched)
          content:
            application/json:
              schema:
                type: object
                properties:
                  flow: { $ref: "#/components/schemas/Flow" }
                  matchedBy: { type: string, enum: [exact, vector] }
                  similarity: { type: number }
  /v1/runs:
    get:
      tags: [History]
      parameters:
        - { name: appPackage, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Voice sessions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Run" } }
                  limit: { type: integer }
                  offset: { type: integer }
    post:
      tags: [History]
      description: Upload finished sessions from the phone. Idempotent by sessionId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runs]
              properties:
                runs: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/Run" } }
      responses:
        "200": { description: Number of new runs stored, content: { application/json: { schema: { type: object, properties: { inserted: { type: integer } } } } } }
    delete:
      tags: [History]
      summary: Delete all history
      responses:
        "204": { description: Deleted }
  /v1/runs/stats:
    get:
      tags: [History]
      responses:
        "200":
          description: Totals and top apps
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRuns: { type: integer }
                  completedRuns: { type: integer }
                  fieldsFilled: { type: integer }
                  topApps: { type: array, items: { type: object, properties: { appPackage: { type: string }, runs: { type: integer } } } }
  /v1/runs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [History]
      responses:
        "200": { description: Run, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
    delete:
      tags: [History]
      responses:
        "204": { description: Deleted }
  /v1/ai/vision:
    post:
      tags: [AI]
      description: |
        Vision fallback for apps that expose no readable accessibility nodes: detects input fields and
        buttons on a screenshot (JPEG, base64) and returns their boxes in image pixels.
        Requires a vision-capable provider (anthropic or openai).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageName, imageBase64, width, height]
              properties:
                packageName: { type: string }
                imageBase64: { type: string }
                width: { type: integer }
                height: { type: integer }
                language: { type: string, enum: [ENGLISH, HINDI, HINGLISH, MARATHI, TAMIL, TELUGU, BENGALI, GUJARATI] }
      responses:
        "200":
          description: Detected elements
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  elements:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: "vision:e1" }
                        kind: { $ref: "#/components/schemas/ElementKind" }
                        label: { type: string }
                        fieldType: { $ref: "#/components/schemas/FieldType" }
                        x: { type: integer }
                        y: { type: integer }
                        width: { type: integer }
                        height: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/devices:
    post:
      tags: [Automation]
      summary: Register (or update) this phone for remote runs
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RegisterDevice" } } } }
      responses:
        "200": { description: Device, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "409": { description: Device id belongs to another account }
    get:
      tags: [Automation]
      summary: Phones signed in to this account
      responses:
        "200": { description: Devices, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Device" } } } } }
  /v1/devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Automation]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, remoteRuns: { type: boolean } } } } } }
      responses:
        "200": { description: Device, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
    delete:
      tags: [Automation]
      responses:
        "204": { description: Removed }
  /v1/devices/{id}/commands:
    get:
      tags: [Automation]
      summary: Long-poll used by the phone for flows to run and runs to stop
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 30, default: 25 } }
      responses:
        "200":
          description: Pending run requests (now DELIVERED) and run ids to cancel
          content: { application/json: { schema: { type: object, properties: { run: { type: array, items: { $ref: "#/components/schemas/RunRequest" } }, cancel: { type: array, items: { type: string } } } } } }
  /v1/devices/{id}/triggers:
    get:
      tags: [Automation]
      summary: Enabled app-open triggers and voice shortcuts that apply to this phone
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Triggers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Trigger" } } } } }
  /v1/devices/{id}/app-open-runs:
    post:
      tags: [Automation]
      summary: The phone started a flow by itself (its app opened, or a voice shortcut was said)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [flowId], properties: { flowId: { type: string }, triggerId: { type: string }, source: { type: string, enum: [APP_OPEN, VOICE], default: APP_OPEN } } } } } }
      responses:
        "201": { description: Run request, content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
  /v1/flows/{id}/triggers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Automation]
      responses:
        "200": { description: Triggers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Trigger" } } } } }
    post:
      tags: [Automation]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TriggerInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Trigger" } } } }
        "400": { description: Invalid schedule or time zone }
  /v1/triggers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Automation]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TriggerInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Trigger" } } } }
    delete:
      tags: [Automation]
      responses:
        "204": { description: Deleted }
  /v1/run-requests:
    post:
      tags: [Automation]
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      summary: Run a flow now on a phone (default the most recently seen one)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [flowId], properties: { flowId: { type: string }, deviceId: { type: string } } } } } }
      responses:
        "201": { description: Run request, content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
        "400": { description: No phone, or remote runs are off on it }
    get:
      tags: [Automation]
      parameters:
        - { name: flowId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200": { description: Run requests, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RunRequest" } } } } }
  /v1/run-requests/{id}:
    get:
      tags: [Automation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Run request, content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
  /v1/run-requests/{id}/events:
    get:
      tags: [Automation]
      summary: Live log (long-poll) — events after `after`, waiting up to `wait` seconds for new ones
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 30, default: 0 } }
      responses:
        "200":
          description: Current request and new events
          content: { application/json: { schema: { type: object, properties: { request: { $ref: "#/components/schemas/RunRequest" }, events: { type: array, items: { $ref: "#/components/schemas/RunEvent" } } } } } }
  /v1/run-requests/{id}/cancel:
    post:
      tags: [Automation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Cancelled (or stop requested), content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
        "409": { description: Already finished }
  /v1/run-requests/{id}/report:
    post:
      tags: [Automation]
      summary: Status and value-free log lines from the phone running the request
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                status: { $ref: "#/components/schemas/RunRequestStatus" }
                events: { type: array, maxItems: 50, items: { type: object, properties: { kind: { type: string }, message: { type: string, maxLength: 300 } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
        "403": { description: Run belongs to another device }
        "409": { description: Already finished }
  /v1/marketplace:
    get:
      tags: [Marketplace]
      summary: Browse and search published flows and starter templates
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Full-text search over name, description, app and tags }
        - { name: category, in: query, schema: { type: string } }
        - { name: appPackage, in: query, schema: { type: string } }
        - { name: templates, in: query, schema: { type: boolean } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [popular, rating, recent, relevance] } }
        - { name: limit, in: query, schema: { type: integer, default: 24 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: Listings, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Listing" } }, limit: { type: integer }, offset: { type: integer } } } } } }
  /v1/marketplace/categories:
    get:
      tags: [Marketplace]
      responses:
        "200": { description: Category ids, content: { application/json: { schema: { type: array, items: { type: string } } } } }
  /v1/marketplace/templates:
    get:
      tags: [Marketplace]
      summary: Starter templates with their steps and per-step matching keywords
      responses:
        "200":
          description: Templates
          content: { application/json: { schema: { type: array, items: { type: object, properties: { listing: { $ref: "#/components/schemas/Listing" }, steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }, keywords: { type: object, additionalProperties: { type: array, items: { type: string } } } } } } } }
  /v1/marketplace/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Marketplace]
      summary: Listing with latest steps, versions, reviews and your imported copy
      responses:
        "200": { description: Listing detail, content: { application/json: { schema: { $ref: "#/components/schemas/ListingDetail" } } } }
    delete:
      tags: [Marketplace]
      summary: Unpublish (owner); importers keep their copies
      responses:
        "204": { description: Unpublished }
  /v1/marketplace/{id}/import:
    post:
      tags: [Marketplace]
      summary: Import into your flows (or as a new version of your flow for the same screen)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { content: { application/json: { schema: { type: object, properties: { version: { type: integer } } } } } }
      responses:
        "201": { description: Your flow, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "400": { description: Templates are applied, not imported }
  /v1/marketplace/{id}/report:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Marketplace]
      summary: Report a listing (one report per person; reporting again replaces it)
      description: After 3 different people report a listing it is hidden from search (its owner still sees it) until the owner publishes a fixed version, which clears the reports. Built-in templates are never hidden.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, enum: [broken, unsafe, spam, other] }, note: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { description: Whether the listing is now hidden, content: { application/json: { schema: { type: object, properties: { hidden: { type: boolean } } } } } }
        "400": { description: Own listing or unknown reason }
  /v1/marketplace/{id}/rating:
    put:
      tags: [Marketplace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [stars], properties: { stars: { type: integer, minimum: 1, maximum: 5 }, review: { type: string, maxLength: 500 } } } } } }
      responses:
        "200": { description: Listing with updated rating, content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } } }
  /v1/flows/{id}/publish:
    post:
      tags: [Marketplace]
      summary: Publish the flow's current version (default values are removed); publishing again adds a version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [category], properties: { name: { type: string }, description: { type: string, maxLength: 1000 }, category: { type: string }, tags: { type: array, maxItems: 8, items: { type: string, maxLength: 24 } }, changelog: { type: string } } } } }
      responses:
        "200": { description: Listing, content: { application/json: { schema: { $ref: "#/components/schemas/Listing" } } } }
  /v1/flows/{id}/update-from-source:
    post:
      tags: [Marketplace]
      summary: Update an imported flow to the listing's latest version (as a new version)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated flow, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "409": { description: Already up to date }
  /v1/flows/{id}/transfer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Flows, Teams]
      summary: Move a flow into an organization (editor there) or back to your own flows (admin of its organization)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { orgId: { type: string, format: uuid, nullable: true } } } } }
      responses:
        "200": { description: Moved flow, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/orgs:
    get:
      tags: [Teams]
      summary: Your organizations and your role in each
      responses:
        "200": { description: Organizations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Organization" } } } } }
    post:
      tags: [Teams]
      summary: Create an organization (you become its admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
  /v1/orgs/{orgId}:
    parameters: [{ $ref: "#/components/parameters/OrgPath" }]
    patch:
      tags: [Teams]
      summary: Rename (admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } } }
      responses: { "204": { description: Renamed } }
    delete:
      tags: [Teams]
      summary: Delete the organization and its flows, keys and webhooks (admin)
      responses: { "204": { description: Deleted } }
  /v1/orgs/{orgId}/members:
    parameters: [{ $ref: "#/components/parameters/OrgPath" }]
    get:
      tags: [Teams]
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Member" } } } } }
  /v1/orgs/{orgId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Teams]
      summary: Change a member's role (admin; an organization keeps at least one admin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { role: { $ref: "#/components/schemas/Role" } } } } } }
      responses: { "204": { description: Changed } }
    delete:
      tags: [Teams]
      summary: Remove a member (admin) or leave (yourself)
      responses: { "204": { description: Removed } }
  /v1/orgs/{orgId}/invitations:
    parameters: [{ $ref: "#/components/parameters/OrgPath" }]
    get:
      tags: [Teams]
      summary: Open invitations (admin)
      responses:
        "200": { description: Invitations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } }
    post:
      tags: [Teams]
      summary: Invite by email (admin); the response's token is shown once and expires after 7 days
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string }, role: { $ref: "#/components/schemas/Role" } } } } }
      responses:
        "201": { description: Invitation with token, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
  /v1/orgs/{orgId}/invitations/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Teams]
      responses: { "204": { description: Revoked } }
  /v1/invitations/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Teams]
      summary: What an invitation link is for
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { type: object, properties: { orgName: { type: string }, email: { type: string }, role: { $ref: "#/components/schemas/Role" }, expiresAt: { type: string, format: date-time } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/invitations/{token}/accept:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Teams]
      summary: Join (the signed-in account's email must match the invitation)
      responses:
        "200": { description: Joined organization, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/orgs/{orgId}/api-keys:
    parameters: [{ $ref: "#/components/parameters/OrgPath" }]
    get:
      tags: [Teams]
      summary: API keys (admin); secrets are never returned again
      responses:
        "200": { description: Keys, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } } } } }
    post:
      tags: [Teams]
      summary: Create a key (admin); `secret` is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string, enum: ["flows:read", "flows:write", "runs:write"] } }
                rateLimitPerMinute: { type: integer, default: 60, minimum: 1, maximum: 10000 }
                expiresInDays: { type: integer, minimum: 1, maximum: 365, description: The key stops working after this many days (default never) }
      responses:
        "201": { description: Key with secret, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKey" } } } }
  /v1/orgs/{orgId}/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Teams]
      responses: { "204": { description: Revoked } }
  /v1/orgs/{orgId}/webhooks:
    parameters: [{ $ref: "#/components/parameters/OrgPath" }]
    get:
      tags: [Teams]
      responses:
        "200": { description: Webhooks, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Webhook" } } } } }
    post:
      tags: [Teams]
      summary: Add a webhook (admin, https and public addresses only); `secret` is returned once
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookRequest" } } } }
      responses:
        "201": { description: Webhook with secret, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /v1/orgs/{orgId}/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Teams]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookRequest" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } } }
    delete:
      tags: [Teams]
      responses: { "204": { description: Deleted } }
  /v1/orgs/{orgId}/webhooks/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Teams]
      responses: { "200": { description: Webhook with the new secret, content: { application/json: { schema: { $ref: "#/components/schemas/Webhook" } } } } }
  /v1/orgs/{orgId}/webhooks/{id}/ping:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Teams]
      summary: Queue a `ping` delivery
      responses: { "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } } }
  /v1/orgs/{orgId}/webhooks/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
    get:
      tags: [Teams]
      responses:
        "200": { description: Recent deliveries, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } } } } }
  /v1/orgs/{orgId}/webhooks/deliveries/{deliveryId}/redeliver:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Teams]
      responses: { "200": { description: Queued again, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } } }
  /v1/orgs/{orgId}/audit:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: action, in: query, description: "Exact action or prefix (\"member\" matches member.*)", schema: { type: string } }
      - { name: before, in: query, description: Entries older than this id (paging), schema: { type: integer } }
      - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      - { name: from, in: query, description: "From this day (2026-10-01) or instant", schema: { type: string } }
      - { name: to, in: query, description: "Up to and including this day, or before this instant", schema: { type: string } }
    get:
      tags: [Teams]
      summary: Audit log, newest first (admin)
      responses:
        "200": { description: Entries, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }
  /v1/orgs/{orgId}/audit/export:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: action, in: query, schema: { type: string } }
      - { name: from, in: query, schema: { type: string } }
      - { name: to, in: query, schema: { type: string } }
    get:
      tags: [Teams]
      summary: Audit log as CSV (admin; newest first, up to 10000 entries; the export itself is audited)
      responses:
        "200": { description: CSV file, content: { text/csv: { schema: { type: string } } } }
  /v1/orgs/{orgId}/usage:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
    get:
      tags: [Teams]
      summary: What the organization uses against its limits (any member)
      description: Limits are set per deployment (ORG_MAX_MEMBERS counts open invitations too, ORG_MAX_API_KEYS counts active keys; webhooks are limited to 20).
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: { type: integer }
                  pendingInvitations: { type: integer }
                  flows: { type: integer }
                  activeApiKeys: { type: integer }
                  webhooks: { type: integer }
                  runs30d: { type: integer, description: Remote runs of organization flows in the last 30 days }
                  maxMembers: { type: integer }
                  maxApiKeys: { type: integer }
                  maxWebhooks: { type: integer }
  /v1/orgs/{orgId}/api-keys/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/OrgPath"
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Teams]
      summary: Replace a key's secret (same name, scopes and limits); the old secret stops working at once (admin)
      responses:
        "200": { description: The key with its new secret (shown once), content: { application/json: { schema: { $ref: "#/components/schemas/ApiKey" } } } }
        "400": { description: The key has expired }
  /v1/flows/{id}/analytics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: days, in: query, schema: { type: integer, default: 30, minimum: 1, maximum: 365 } }
      - { name: tz, in: query, description: IANA time zone for day boundaries, schema: { type: string, default: UTC } }
    get:
      tags: [Analytics]
      summary: Usage, success rate, daily runs and per-step outcomes (all users' runs of the flow, aggregated)
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200": { description: Analytics, content: { application/json: { schema: { $ref: "#/components/schemas/FlowAnalytics" } } } }
  /v1/analytics/flows:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - { name: days, in: query, schema: { type: integer, default: 30 } }
      - { name: tz, in: query, schema: { type: string, default: UTC } }
    get:
      tags: [Analytics]
      summary: Usage of every flow in the workspace, busiest first, with daily totals
      security: [{ bearerAuth: [] }, { apiKeyAuth: [] }]
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  flows:
                    type: array
                    items: { type: object, properties: { flowId: { type: string }, name: { type: string }, appPackage: { type: string }, usage: { $ref: "#/components/schemas/Usage" } } }
                  daily: { type: array, items: { $ref: "#/components/schemas/DailyRuns" } }
                  totals: { $ref: "#/components/schemas/Usage" }
                  previous: { description: "Totals for the same number of days just before the period", allOf: [{ $ref: "#/components/schemas/Usage" }] }
  /v1/flows/{id}/comments:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Collaboration]
      responses:
        "200": { description: Comments, oldest first, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Comment" } } } } }
    post:
      tags: [Collaboration]
      summary: Comment on the flow or one of its steps (anyone who can open the flow)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 2000 }, stepId: { type: string } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
  /v1/comments/{commentId}:
    parameters: [{ name: commentId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Collaboration]
      summary: Edit your comment (`body`) or resolve/reopen (`resolved`; editors for others' comments)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { body: { type: string }, resolved: { type: boolean } } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
    delete:
      tags: [Collaboration]
      summary: Delete your comment (organization admins can delete any)
      responses: { "204": { description: Deleted } }
  /v1/flows/{id}/presence:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Collaboration]
      summary: Heartbeat (every ~15 s) — returns who else has the flow open and its current version
      requestBody: { content: { application/json: { schema: { type: object, properties: { editing: { type: boolean } } } } } }
      responses:
        "200":
          description: Others
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentVersion: { type: integer }
                  others:
                    type: array
                    items: { type: object, properties: { userId: { type: string }, name: { type: string }, editing: { type: boolean }, seenAt: { type: string, format: date-time } } }
    delete:
      tags: [Collaboration]
      summary: Leave (closing the flow)
      responses: { "204": { description: Left } }
  /v1/flows/{id}/layout:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Collaboration]
      summary: Visual builder node positions
      responses:
        "200": { description: Layout, content: { application/json: { schema: { $ref: "#/components/schemas/Layout" } } } }
    put:
      tags: [Collaboration]
      summary: Save node positions (editors)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Layout" } } } }
      responses: { "204": { description: Saved } }
  /v1/care/invites:
    post:
      tags: [Caregiving]
      summary: The person to be helped creates a one-time invite code (valid 30 minutes, at most 5 open)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { permissions: { type: array, items: { type: string, enum: [edit_flows, run_flows, view_history] } } } } } } }
      responses:
        "201": { description: Invite, content: { application/json: { schema: { type: object, properties: { link: { $ref: "#/components/schemas/CareLink" }, code: { type: string, example: "K7QM-29PX" }, expiresAt: { type: string, format: date-time } } } } } }
  /v1/care/accept:
    post:
      tags: [Caregiving]
      summary: The caregiver enters the code (case and dashes ignored; 10 attempts a minute)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        "200": { description: Active link, content: { application/json: { schema: { $ref: "#/components/schemas/CareLink" } } } }
        "404": { description: Wrong or expired code }
        "409": { description: Already helping this person }
  /v1/care/links:
    get:
      tags: [Caregiving]
      summary: People who help me and people I help (and my open invites)
      responses:
        "200": { description: Links, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CareLink" } } } } }
  /v1/care/links/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Caregiving]
      summary: Change what the caregiver may do (the person helped only)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [permissions], properties: { permissions: { type: array, items: { type: string } } } } } } }
      responses:
        "200": { description: Link, content: { application/json: { schema: { $ref: "#/components/schemas/CareLink" } } } }
    delete:
      tags: [Caregiving]
      summary: End the link or cancel the invite (either side); access stops at once
      responses:
        "204": { description: Ended }
  /v1/care/links/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
    get:
      tags: [Caregiving]
      summary: Everything done through the link, newest first
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    action: { type: string, enum: [invited, accepted, permissions_changed, flow_edited, flow_restored, trigger_added, trigger_changed, trigger_removed, flow_added, flow_run, run_stopped, invite_cancelled, ended] }
                    actorEmail: { type: string, nullable: true }
                    details: { type: object, additionalProperties: { type: string } }
                    at: { type: string, format: date-time }
  /v1/me/export:
    get:
      tags: [Auth]
      summary: Download all your data as JSON (GDPR access)
      responses:
        "200": { description: JSON document (account, profile, flows with versions, history, devices, triggers, remote runs, listings, ratings, organizations, comments, API keys created, audit entries, crash reports) }
  /v1/crashes:
    get:
      tags: [Ops]
      summary: Crash reports from your phones, grouped
      responses:
        "200": { description: Groups, newest first }
    post:
      tags: [Ops]
      summary: Upload crash reports (opt-in on the phone; signed in or not; 30 per minute per address)
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reports:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [exception, stacktrace, occurredAtMillis]
                    properties:
                      exception: { type: string }
                      message: { type: string }
                      stacktrace: { type: string }
                      thread: { type: string }
                      appVersion: { type: string }
                      androidSdk: { type: integer }
                      deviceModel: { type: string }
                      occurredAtMillis: { type: integer }
                      installId: { type: string }
      responses:
        "200": { description: Accepted count }
components:
  parameters:
    OrgId:
      name: X-Org-Id
      in: header
      required: false
      description: Organization whose flows to use (omit for your own flows; ignored for API keys).
      schema: { type: string, format: uuid }
    OrgPath: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyAuth: { type: apiKey, in: header, name: X-Api-Key }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: validation_error }
              message: { type: string }
  schemas:
    Usage:
      type: object
      properties:
        runs: { type: integer }
        completed: { type: integer }
        stopped: { type: integer }
        failed: { type: integer }
        users: { type: integer }
        successRate: { type: number, nullable: true }
        avgDurationMillis: { type: integer, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
    DailyRuns:
      type: object
      properties: { date: { type: string, format: date }, completed: { type: integer }, stopped: { type: integer }, failed: { type: integer } }
    FlowAnalytics:
      type: object
      properties:
        usage: { $ref: "#/components/schemas/Usage" }
        daily: { type: array, items: { $ref: "#/components/schemas/DailyRuns" } }
        steps:
          type: array
          items:
            type: object
            properties:
              elementId: { type: string }
              label: { type: string }
              total: { type: integer }
              outcomes: { type: object, additionalProperties: { type: integer }, example: { FILLED: 12, MANUAL: 3 } }
        interpretedBy: { type: object, additionalProperties: { type: integer } }
        remoteRuns: { type: object, additionalProperties: { type: integer } }
        previous: { description: "Usage in the same number of days just before the period", allOf: [{ $ref: "#/components/schemas/Usage" }] }
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        flowId: { type: string, format: uuid }
        userId: { type: string, nullable: true }
        authorName: { type: string, nullable: true }
        authorEmail: { type: string, nullable: true }
        stepId: { type: string, nullable: true }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
    Layout:
      type: object
      properties:
        positions: { type: object, additionalProperties: { type: object, properties: { x: { type: number }, y: { type: number } } } }
    Role: { type: string, enum: [ADMIN, EDITOR, VIEWER] }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
    Member:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        name: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        token: { type: string, description: Only when created }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: vck_ab12cd34 }
        scopes: { type: array, items: { type: string } }
        rateLimitPerMinute: { type: integer }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        secret: { type: string, description: Only when created or rotated }
        expiresAt: { type: string, format: date-time, nullable: true }
        expired: { type: boolean }
        rotatedAt: { type: string, format: date-time, nullable: true }
    WebhookRequest:
      type: object
      properties:
        url: { type: string, example: "https://example.com/hooks/voicecontrol" }
        events: { type: array, items: { type: string, enum: [flow.version_saved, flow.deleted, run.finished] } }
        active: { type: boolean }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        events: { type: array, items: { type: string } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        secret: { type: string, description: Only when created or rotated }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string }
        eventType: { type: string }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        lastStatusCode: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
        payload: { type: string, description: JSON body as sent }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        action: { type: string, example: flow.updated }
        targetType: { type: string }
        targetId: { type: string, nullable: true }
        actorUserId: { type: string, nullable: true }
        actorEmail: { type: string, nullable: true }
        actorApiKeyId: { type: string, nullable: true }
        details: { type: object, additionalProperties: { type: string } }
        at: { type: string, format: date-time }
    Listing:
      type: object
      properties:
        id: { type: string, format: uuid }
        hidden: { type: boolean, description: Hidden from search after reports (only its owner sees this) }
        name: { type: string }
        description: { type: string }
        appPackage: { type: string, description: "\"*\" for templates" }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        isTemplate: { type: boolean }
        ownerName: { type: string, nullable: true }
        mine: { type: boolean }
        latestVersion: { type: integer }
        installCount: { type: integer }
        ratingAverage: { type: number, nullable: true }
        ratingCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ListingDetail:
      type: object
      properties:
        listing: { $ref: "#/components/schemas/Listing" }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
        keywords: { type: object, additionalProperties: { type: array, items: { type: string } } }
        versions: { type: array, items: { type: object, properties: { version: { type: integer }, changelog: { type: string, nullable: true }, stepCount: { type: integer }, createdAt: { type: string, format: date-time } } } }
        myRating: { type: object, nullable: true, properties: { stars: { type: integer }, review: { type: string, nullable: true } } }
        reviews: { type: array, items: { type: object, properties: { stars: { type: integer }, review: { type: string, nullable: true }, userName: { type: string }, updatedAt: { type: string, format: date-time } } } }
        importedFlowId: { type: string, nullable: true }
        importedVersion: { type: integer, nullable: true }
        updateAvailable: { type: boolean }
        myReport: { type: string, nullable: true, enum: [BROKEN, UNSAFE, SPAM, OTHER] }
    RegisterDevice:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid, description: Generated once per installation }
        name: { type: string, maxLength: 60 }
        platform: { type: string, default: android }
        appVersion: { type: string, nullable: true }
        remoteRuns: { type: boolean, nullable: true }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        appVersion: { type: string, nullable: true }
        remoteRuns: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
        online: { type: boolean, description: Polled in the last 90 seconds }
        createdAt: { type: string, format: date-time }
    CareLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [receiver, caregiver], description: "receiver: you are being helped" }
        status: { type: string, enum: [PENDING, ACTIVE] }
        permissions: { type: array, items: { type: string } }
        otherEmail: { type: string, nullable: true }
        otherName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    TriggerInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [APP_OPEN, SCHEDULE, VOICE], description: "VOICE: a voice macro, saying `phrase` on the phone runs the flow" }
        enabled: { type: boolean, default: true }
        phrase: { type: string, nullable: true, minLength: 2, maxLength: 60, description: "VOICE only; unique per account ignoring case and punctuation (409 otherwise)" }
        cron: { type: string, nullable: true, description: "5-field cron (minute hour day month weekday), SCHEDULE only" }
        timezone: { type: string, nullable: true, description: IANA zone, SCHEDULE only }
        deviceId: { type: string, nullable: true, description: Phone to run on; null = most recently seen }
    Trigger:
      allOf:
        - $ref: "#/components/schemas/TriggerInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            flowId: { type: string, format: uuid }
            nextRunAt: { type: string, format: date-time, nullable: true }
            lastRunAt: { type: string, format: date-time, nullable: true }
            upcoming: { type: array, items: { type: string, format: date-time } }
            appPackage: { type: string, nullable: true }
            flowName: { type: string, nullable: true, description: Device list only }
    RunRequestStatus:
      type: string
      enum: [PENDING, DELIVERED, RUNNING, COMPLETED, FAILED, STOPPED, CANCEL_REQUESTED, CANCELLED, EXPIRED]
    RunRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        flowId: { type: string, format: uuid, nullable: true }
        flowName: { type: string }
        appPackage: { type: string }
        deviceId: { type: string, nullable: true }
        triggerId: { type: string, nullable: true }
        source: { type: string, enum: [MANUAL, SCHEDULE, APP_OPEN, VOICE] }
        status: { $ref: "#/components/schemas/RunRequestStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RunEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind: { type: string }
        message: { type: string, description: Labels and outcomes only, never values }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, description: Letters and numbers }
        name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        passwordChangedAt: { type: string, format: date-time, nullable: true }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresInSeconds: { type: integer }
        user: { $ref: "#/components/schemas/User" }
    Profile:
      type: object
      properties:
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        addressLine: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        pincode: { type: string, nullable: true, pattern: "^\\d{6}$" }
        dateOfBirth: { type: string, nullable: true, example: 12/03/1990 }
    ElementKind: { type: string, enum: [TEXT_FIELD, BUTTON, CHECKBOX, SWITCH, RADIO, DROPDOWN, LINK] }
    FieldType: { type: string, enum: [TEXT, NAME, EMAIL, PHONE, NUMBER, PASSWORD, OTP, PIN, DATE, ADDRESS, PINCODE, MULTILINE, SEARCH, URL, AMOUNT] }
    FlowStep:
      type: object
      required: [id, order, elementId, label, kind]
      properties:
        id: { type: string }
        order: { type: integer }
        elementId: { type: string, description: Stable element id on the screen }
        label: { type: string }
        kind: { $ref: "#/components/schemas/ElementKind" }
        fieldType: { $ref: "#/components/schemas/FieldType" }
        action:
          type: string
          enum: [FILL, CLICK, TOGGLE, READ, SET_VARIABLE, REPEAT, NEXT_SCREEN, OPEN_APP]
          description: >-
            Element steps (FILL, CLICK, TOGGLE, READ) need elementId. Logic steps: SET_VARIABLE stores valueExpression
            in variable; REPEAT loops over repeat.stepIds; NEXT_SCREEN waits for the next screen; OPEN_APP opens appPackage.
        question: { type: string, nullable: true, description: Custom spoken question }
        rules:
          type: array
          items: { type: string }
          description: "required | email | phone | pincode | digits:N | min:N | max:N | regex:<pattern> | oneOf:a|b"
        defaultValue: { type: string, nullable: true }
        skip: { type: boolean }
        helpVideoUrl: { type: string, nullable: true, description: https link shown during this step }
        profileKey: { type: string, nullable: true, enum: [FULL_NAME, FIRST_NAME, LAST_NAME, EMAIL, PHONE, ADDRESS_LINE, CITY, STATE, PINCODE, DATE_OF_BIRTH] }
        condition: { type: string, nullable: true, description: "Expression (docs/spec/expressions.json); the step runs only when true" }
        elseValue: { type: string, nullable: true, description: Expression filled when the condition is false }
        variable: { type: string, nullable: true, pattern: "^[A-Za-z_][A-Za-z0-9_]*$", description: "Receives the answer; default is the label in snake_case" }
        valueExpression: { type: string, nullable: true, description: Expression filled (or stored) without asking }
        repeat: { $ref: "#/components/schemas/RepeatSpec" }
        appPackage: { type: string, nullable: true, description: OPEN_APP target or the app NEXT_SCREEN expects }
        waitSeconds: { type: integer, nullable: true, minimum: 1, maximum: 120 }
    RepeatSpec:
      type: object
      nullable: true
      properties:
        stepIds: { type: array, items: { type: string }, description: Steps run once per item (same screen) }
        addMoreElementId: { type: string, nullable: true }
        addMoreLabel: { type: string, nullable: true, description: Button pressed between items }
        maxIterations: { type: integer, minimum: 1, maximum: 50 }
        countExpression: { type: string, nullable: true, description: "Number of items; when absent the user is asked 'add another?'" }
        itemLabel: { type: string, nullable: true }
    FlowSummary:
      type: object
      properties:
        orgId: { type: string, format: uuid, nullable: true, description: Owning organization (null for personal flows) }
        id: { type: string, format: uuid }
        appPackage: { type: string }
        name: { type: string }
        currentVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Flow:
      type: object
      properties:
        orgId: { type: string, format: uuid, nullable: true, description: Owning organization (null for personal flows) }
        id: { type: string, format: uuid }
        version: { type: integer }
        appPackage: { type: string }
        name: { type: string }
        screenSignature: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
        updatedAtMillis: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sourcePublishedId: { type: string, nullable: true, description: Marketplace listing this flow was imported from }
        sourceVersion: { type: integer, nullable: true }
    FlowVersion:
      type: object
      properties:
        version: { type: integer }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
        source: { type: string, enum: [DEVICE, DASHBOARD, ROLLBACK, IMPORT, RECORDED, CAREGIVER] }
        changeNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateFlowRequest:
      type: object
      required: [appPackage, name, screenSignature, steps]
      properties:
        source: { type: string, enum: [RECORDED], description: "RECORDED when the flow was taught on the phone by demonstration (version source RECORDED)" }
        appPackage: { type: string, example: com.example.shop }
        name: { type: string }
        screenSignature: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
    UpdateFlowRequest:
      type: object
      required: [expectedVersion, steps]
      properties:
        expectedVersion: { type: integer }
        name: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/FlowStep" } }
        changeNote: { type: string }
    ScreenElement:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ElementKind" }
        label: { type: string }
        fieldType: { $ref: "#/components/schemas/FieldType" }
        hint: { type: string }
        value: { type: string, description: Never sent for sensitive fields }
        isSensitive: { type: boolean }
        isEnabled: { type: boolean }
        isChecked: { type: boolean }
    ScreenContext:
      type: object
      required: [packageName, elements]
      properties:
        packageName: { type: string }
        activityName: { type: string }
        title: { type: string }
        signature: { type: string }
        elements: { type: array, items: { $ref: "#/components/schemas/ScreenElement" } }
    InterpretRequest:
      type: object
      required: [screen, utterance]
      properties:
        screen: { $ref: "#/components/schemas/ScreenContext" }
        currentFieldId: { type: string }
        utterance: { type: string, maxLength: 500 }
        language: { type: string, enum: [ENGLISH, HINDI, HINGLISH, MARATHI, TAMIL, TELUGU, BENGALI, GUJARATI] }
        question: { type: string }
        transliterate: { type: boolean }
        memory:
          type: array
          maxItems: 12
          description: Earlier answers in this session (never sensitive values), to resolve "same as above", "his name", etc.
          items: { type: object, properties: { label: { type: string }, value: { type: string } } }
    Run:
      type: object
      required: [sessionId, appPackage, startedAtMillis, endedAtMillis, status, language, screens]
      properties:
        sessionId: { type: string, format: uuid }
        appPackage: { type: string }
        startedAtMillis: { type: integer, format: int64 }
        endedAtMillis: { type: integer, format: int64 }
        status: { type: string, enum: [COMPLETED, STOPPED, FAILED] }
        language: { type: string, enum: [ENGLISH, HINDI, HINGLISH, MARATHI, TAMIL, TELUGU, BENGALI, GUJARATI] }
        filledCount: { type: integer, readOnly: true }
        stepCount: { type: integer, readOnly: true }
        screens:
          type: array
          items:
            type: object
            properties:
              appPackage: { type: string }
              activityName: { type: string }
              screenTitle: { type: string }
              screenSignature: { type: string }
              flowId: { type: string }
              flowVersion: { type: integer }
              steps:
                type: array
                items:
                  type: object
                  properties:
                    elementId: { type: string }
                    label: { type: string }
                    kind: { $ref: "#/components/schemas/ElementKind" }
                    fieldType: { $ref: "#/components/schemas/FieldType" }
                    question: { type: string }
                    outcome: { type: string, enum: [FILLED, DEFAULT_FILLED, KEPT, SKIPPED, MANUAL, CLICKED, TOGGLED, FAILED] }
                    interpretedBy: { type: string }
    Interpretation:
      type: object
      properties:
        intent: { type: string, enum: [FILL, CLICK, NEXT, PREVIOUS, SKIP, SUBMIT, BACK, SCROLL_DOWN, SCROLL_UP, REPEAT, STOP, YES, NO, CLEAR, HELP, UNDO, READ_SCREEN, UNKNOWN] }
        targetId: { type: string }
        value: { type: string }
        extraFills:
          type: array
          items: { type: object, properties: { targetId: { type: string }, value: { type: string } } }
        reply: { type: string }
        confidence: { type: number }
        source: { type: string, example: anthropic }

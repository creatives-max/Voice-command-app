name: voicecontrol

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: voicecontrol
      POSTGRES_USER: voicecontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voicecontrol}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicecontrol -d voicecontrol"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/voicecontrol
      DATABASE_USER: voicecontrol
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-voicecontrol}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-rules}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  dashboard:
    build: ./dashboard
    environment:
      BACKEND_URL: http://backend:8080
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
